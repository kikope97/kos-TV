<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="kOS TV, el cliente de Jellyfin de casa">
  <meta name="theme-color" content="#000000">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="kOS TV">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>kOS TV</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      color: #ffffff;
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
    }

    /* Kos TV: until Flutter draws its first frame, the ring of the kOS TV
       logo with its comet running around it. */
    #kostv-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      transition: opacity 180ms ease-out;
      z-index: 9999;
      pointer-events: none;
    }

    #kostv-loader svg {
      width: 120px;
      height: 120px;
      overflow: visible;
    }

    #kostv-loader .comet {
      transform-origin: 50px 50px;
      animation: kostv-comet 1.4s linear infinite;
    }

    #kostv-loader.ready {
      opacity: 0;
    }

    @keyframes kostv-comet {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

  <script defer src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script>
    (function () {
      function isHlsPlaylistUrl(url) {
        if (typeof url !== 'string' || !url) {
          return false;
        }
        var normalized = url.toLowerCase();
        if (normalized.indexOf('.m3u8') !== -1) {
          return true;
        }
        return normalized.indexOf('format=hls') !== -1;
      }

      // The URL with its token= value replaced, for a URL that carries one.
      function withToken(url, token) {
        if (typeof url !== 'string') {
          return url;
        }
        return url.replace(
          /([?&])token=[^&#]*/,
          '$1token=' + encodeURIComponent(token)
        );
      }

      function shouldTreatAsHls(url, forceHls) {
        return !!forceHls || isHlsPlaylistUrl(url);
      }

      window.MoonfinHlsBridge = {
        // hls.js is preferred whenever MediaSource is available. canPlayType
        // isn't consulted because Chromium reports native HLS support it
        // can't actually deliver (black screen on MPEG-TS segments). Browsers
        // without MSE, like iPhone Safari, fall through to the native
        // video element, which plays HLS natively there.
        canUseHlsJs: function (video, url, forceHls) {
          if (!shouldTreatAsHls(url, forceHls)) {
            return false;
          }
          if (typeof window.Hls === 'undefined') {
            return false;
          }
          if (typeof window.Hls.isSupported !== 'function') {
            return false;
          }
          return !!window.Hls.isSupported();
        },
        attach: function (video, url, forceHls, onFatalError) {
          if (!this.canUseHlsJs(video, url, forceHls)) {
            return null;
          }
          var hls = new window.Hls({
            enableWorker: true,
            lowLatencyMode: true,
            backBufferLength: 90,
            // A stream that authenticates with a token in its URLs gets
            // renewed ones through setToken while it plays, and every request
            // after that carries the latest.
            xhrSetup: function (xhr, requestUrl) {
              if (hls && hls.moonfinToken) {
                xhr.open('GET', withToken(requestUrl, hls.moonfinToken), true);
              }
            },
          });
          if (typeof onFatalError === 'function') {
            hls.on(window.Hls.Events.ERROR, function (_, data) {
              if (!data || !data.fatal) {
                return;
              }
              var status = data.response && data.response.code;
              onFatalError(
                String(data.type || ''),
                String(data.details || ''),
                typeof status === 'number' ? status : 0
              );
            });
          }
          hls.loadSource(url);
          hls.attachMedia(video);
          return hls;
        },
        setToken: function (hls, token) {
          if (hls) {
            hls.moonfinToken = token;
          }
        },
        destroy: function (hls) {
          if (hls && typeof hls.destroy === 'function') {
            hls.destroy();
          }
        },
      };

      window.addEventListener('flutter-first-frame', function () {
        var loader = document.getElementById('kostv-loader');
        if (!loader) {
          return;
        }
        loader.classList.add('ready');
        setTimeout(function () {
          if (loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 220);
      });
    })();
  </script>
</head>
<body>
  <div id="kostv-loader" aria-hidden="true">
    <svg viewBox="0 0 100 100">
      <defs>
        <linearGradient id="kostv-ring" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#4fd8ff"/>
          <stop offset=".55" stop-color="#8f6bff"/>
          <stop offset="1" stop-color="#ff5ccf"/>
        </linearGradient>
      </defs>
      <circle cx="50" cy="50" r="42" fill="none" stroke="url(#kostv-ring)" stroke-width="16"/>
      <circle class="comet" cx="50" cy="50" r="42" fill="none" stroke="#fff" stroke-width="9"
              stroke-linecap="round" pathLength="100" stroke-dasharray="9 91"
              style="filter: drop-shadow(0 0 4px rgba(79, 216, 255, .95))"/>
    </svg>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
