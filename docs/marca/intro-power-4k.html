<untrusted-document-cd32dd80fec1><!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kOS TV — Intro Power 4K</title>
<style>
  @font-face{font-family:'Outfit';font-weight:200;font-display:block;src:url(../../assets/fonts/Outfit-ExtraLight.ttf) format('truetype')}
  @font-face{font-family:'Outfit';font-weight:300;font-display:block;src:url(../../assets/fonts/Outfit-Light.ttf) format('truetype')}
  @font-face{font-family:'Outfit';font-weight:700;font-display:block;src:url(../../assets/fonts/Outfit-Bold.ttf) format('truetype')}
  :root{ --cyan:#4fd8ff; --violet:#8f6bff; --pink:#ff5ccf; --ink:#f3f5fa; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden;font-family:'Outfit',system-ui,sans-serif}

  /* Lienzo 4K fijo (3840×2160) escalado al viewport */
  #stage{position:absolute;left:50%;top:50%;width:3840px;height:2160px;margin:-1080px 0 0 -1920px;
         background:#000;overflow:hidden;transform-origin:center center}

  /* ---------- Luces del "pulsado" ---------- */
  .fx{position:absolute;left:1920px;top:var(--CY);width:0;height:0}
  .fx > *{position:absolute;left:0;top:0;opacity:0}
  .glow{width:2000px;height:2000px;margin:-1000px 0 0 -1000px;border-radius:50%;
        background:radial-gradient(circle,rgba(130,180,255,.38) 0%,rgba(110,120,255,.13) 28%,transparent 62%)}
  .rip{width:var(--D);height:var(--D);margin:calc(var(--D) / -2) 0 0 calc(var(--D) / -2);border-radius:50%;
       border:4px solid var(--cyan);box-shadow:0 0 34px rgba(79,216,255,.55),inset 0 0 34px rgba(79,216,255,.3)}
  .rip.r2{border-color:var(--violet);box-shadow:0 0 34px rgba(143,107,255,.55),inset 0 0 34px rgba(143,107,255,.3)}
  .rip.r3{border-color:var(--pink);box-shadow:0 0 34px rgba(255,92,207,.5),inset 0 0 34px rgba(255,92,207,.25)}
  .vbeam{width:8px;height:2600px;margin:-1300px 0 0 -4px;
         background:linear-gradient(180deg,transparent 0%,var(--cyan) 30%,#fff 50%,var(--violet) 70%,transparent 100%);
         box-shadow:0 0 40px 8px rgba(120,200,255,.45)}
  .hstreak{width:3800px;height:6px;margin:-3px 0 0 -1900px;filter:blur(1px);
         background:linear-gradient(90deg,transparent 0%,rgba(79,216,255,.8) 40%,#fff 50%,rgba(143,107,255,.8) 60%,transparent 100%)}
  .hstreak.s2{background:linear-gradient(90deg,transparent 30%,rgba(79,216,255,.7) 47%,#fff 50%,rgba(255,92,207,.7) 53%,transparent 70%)}

  /* ---------- Logo ---------- */
  .logo{position:absolute;left:0;top:0;white-space:nowrap;line-height:1;font-size:480px;font-weight:700;letter-spacing:0;
        color:var(--ink);transform-origin:var(--ox) var(--oy);transform:scale(1.06)}
  .l{display:inline-block;opacity:0}
  .o{display:inline-block;visibility:hidden}
  .tv{font-weight:200;letter-spacing:.01em;margin-left:.17em}
  .tv i{font-style:normal;background:linear-gradient(100deg,var(--cyan),var(--violet) 55%,var(--pink));
        -webkit-background-clip:text;background-clip:text;color:transparent}
  .bl{display:inline-block;width:0;height:0;vertical-align:baseline}

  /* Anillo de encendido = la "O" */
  .pw{position:absolute;width:var(--H);height:var(--H);opacity:0;
      transform:translate(var(--sx),0) scale(var(--k))}
  .pw svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .arc,.bar{fill:none;stroke:var(--ink);stroke-width:var(--sw0);stroke-linecap:round;stroke-dasharray:100 300;stroke-dashoffset:100.5}
  .bar{opacity:0}
  .cwrap{position:absolute;inset:0;opacity:0}
  .cwrap.cg{filter:blur(26px)}
  .comet{position:absolute;inset:0;border-radius:50%;
         background:conic-gradient(from 0deg,transparent 0 60%,var(--cyan) 82%,var(--violet) 91%,var(--pink) 95%,var(--ink) 100%);
         -webkit-mask:radial-gradient(circle closest-side,transparent calc(100% - var(--t) - 1px),#000 calc(100% - var(--t)),#000 calc(100% - 1px),transparent 100%);
                 mask:radial-gradient(circle closest-side,transparent calc(100% - var(--t) - 1px),#000 calc(100% - var(--t)),#000 calc(100% - 1px),transparent 100%)}

  .sub{position:absolute;left:0;width:3840px;top:var(--subY);text-align:center;font-size:64px;font-weight:300;color:#8d96aa;
       letter-spacing:.6em;padding-left:.6em;white-space:nowrap;opacity:0}
  .sub b{font-weight:400;color:#c9d2e6}

  .fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}

  /* ---------- Timeline (≈7,2 s) ---------- */
  .play .pw   {animation:pwIn .15s linear .3s forwards, press .5s cubic-bezier(.3,0,.2,1) 1.5s, travel 1.05s cubic-bezier(.65,0,.2,1) 1.95s forwards}
  .play .arc  {animation:draw .95s cubic-bezier(.6,0,.2,1) .35s forwards, close .4s cubic-bezier(.5,0,.2,1) 1.5s forwards, thick 1.05s cubic-bezier(.65,0,.2,1) 1.95s forwards}
  .play .bar  {animation:barIn .4s cubic-bezier(.3,.8,.2,1) 1s forwards, barOut .3s ease-in 1.5s forwards}
  .play .glow {animation:glow 1.7s ease-out 1.5s forwards}
  .play .vbeam{animation:vbeam .7s cubic-bezier(.2,.8,.2,1) 1.5s forwards}
  .play .hstreak.s1{animation:hflash 1.1s cubic-bezier(.2,.8,.2,1) 1.56s forwards}
  .play .rip.r1{animation:rip 1.5s cubic-bezier(.1,.6,.3,1) 1.55s forwards}
  .play .rip.r2{animation:rip 1.6s cubic-bezier(.1,.6,.3,1) 1.73s forwards}
  .play .rip.r3{animation:rip 1.7s cubic-bezier(.1,.6,.3,1) 1.91s forwards}
  .play .logo {animation:settle 4.6s cubic-bezier(.2,.6,.2,1) 1.95s forwards}
  .play .l.k  {animation:letL 1s cubic-bezier(.16,1,.3,1) 2.5s forwards}
  .play .l.s  {animation:letR 1s cubic-bezier(.16,1,.3,1) 2.56s forwards}
  .play .l.tv {animation:letR 1.2s cubic-bezier(.16,1,.3,1) 2.74s forwards}
  .play .hstreak.s2{animation:hsweep 1.3s cubic-bezier(.3,.7,.2,1) 2.7s forwards}
  .play .cwrap{animation:fadeIn .7s ease 3s forwards}
  .play .comet{animation:spin 2.6s linear 3s infinite}
  .play .sub  {animation:sub 1.4s cubic-bezier(.16,1,.3,1) 3.3s forwards}
  .play .fade {animation:fadeIn .8s ease-in 6.4s forwards}

  @keyframes pwIn{to{opacity:1}}
  @keyframes press{0%{transform:translate(var(--sx),0) scale(var(--k))}30%{transform:translate(var(--sx),0) scale(calc(var(--k) * .9))}100%{transform:translate(var(--sx),0) scale(var(--k))}}
  @keyframes travel{from{transform:translate(var(--sx),0) scale(var(--k))}to{transform:translate(0,0) scale(1)}}
  @keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:13}}
  @keyframes close{from{stroke-dashoffset:13}to{stroke-dashoffset:0}}
  @keyframes thick{to{stroke-width:var(--sw1)}}
  @keyframes barIn{0%{opacity:1;stroke-dashoffset:100}100%{opacity:1;stroke-dashoffset:0}}
  @keyframes barOut{from{opacity:1;stroke-dashoffset:0}to{opacity:0;stroke-dashoffset:100}}
  @keyframes glow{0%{opacity:0;transform:scale(.5)}18%{opacity:1}100%{opacity:0;transform:scale(1.3)}}
  @keyframes vbeam{0%{opacity:1;transform:scaleY(0)}35%{opacity:1;transform:scaleY(1)}100%{opacity:0;transform:scaleY(1) scaleX(.2)}}
  @keyframes hflash{0%{opacity:1;transform:scaleX(0)}30%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1.05) scaleY(.4)}}
  @keyframes hsweep{0%{opacity:0;transform:translateX(-1300px)}25%{opacity:.9}100%{opacity:0;transform:translateX(1300px)}}
  @keyframes rip{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(3.4)}}
  @keyframes settle{from{transform:scale(1.06)}to{transform:scale(1)}}
  @keyframes letL{0%{opacity:0;transform:translateX(150px);filter:blur(14px) drop-shadow(0 0 0 rgba(120,210,255,0))}
                  45%{opacity:1;filter:blur(0) drop-shadow(0 0 46px rgba(120,210,255,.95))}
                  100%{opacity:1;transform:translateX(0);filter:blur(0) drop-shadow(0 0 0 rgba(120,210,255,0))}}
  @keyframes letR{0%{opacity:0;transform:translateX(-150px);filter:blur(14px) drop-shadow(0 0 0 rgba(150,140,255,0))}
                  45%{opacity:1;filter:blur(0) drop-shadow(0 0 46px rgba(150,140,255,.95))}
                  100%{opacity:1;transform:translateX(0);filter:blur(0) drop-shadow(0 0 0 rgba(150,140,255,0))}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes sub{0%{opacity:0;letter-spacing:1.2em;filter:blur(10px)}100%{opacity:1;letter-spacing:.6em;filter:blur(0)}}
  @keyframes fadeIn{to{opacity:1}}

  /* Controles (fuera del lienzo 4K) */
  .controls{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;
            opacity:0;transition:opacity .5s;z-index:10;pointer-events:none}
  .controls.show{opacity:1;pointer-events:auto}
  button{font:500 14px 'Outfit',sans-serif;color:#dfe7ff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);
         padding:10px 18px;border-radius:999px;cursor:pointer}
  button:hover{background:rgba(255,255,255,.12)}
  .res{position:fixed;top:12px;right:14px;font:400 11px 'Outfit',sans-serif;color:#444;letter-spacing:.1em}
</style>
</head>
<body>
<div id="stage">
  <div class="fx">
    <div class="glow"></div>
    <div class="rip r1"></div><div class="rip r2"></div><div class="rip r3"></div>
    <div class="vbeam"></div>
    <div class="hstreak s1"></div>
    <div class="hstreak s2"></div>
  </div>

  <div class="logo" id="logo"><span class="l k">k</span><span class="o" id="o">O</span><span class="l s">S</span><span class="l tv"><i>TV</i></span><span class="bl" id="bl"></span>
    <div class="pw" id="pw">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <path class="arc" id="a1" pathLength="100" d=""/>
        <path class="arc" id="a2" pathLength="100" d=""/>
        <line class="bar" id="bar" pathLength="100" x1="50" x2="50" y1="0" y2="40"/>
      </svg>
      <div class="cwrap cg"><div class="comet"></div></div>
      <div class="cwrap"><div class="comet"></div></div>
    </div>
  </div>

  <div class="fade"></div>
</div>

<div class="res">3840 × 2160</div>
<div class="controls" id="controls">
  <button id="replay">↻ Repetir</button>
  <button id="sound">♪ Con sonido</button>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const stage = $('stage'), controls = $('controls');
  const DURATION = 7300, FS = 480, CY = 1000, K = 2.3;
  let endTimer, ac;

  function fit(){
    stage.style.transform = `scale(${Math.min(innerWidth / 3840, innerHeight / 2160)})`;
  }
  addEventListener('resize', fit); fit();

  /* Mide la "O" real de la fuente para que el anillo la sustituya exactamente */
  function layout(){
    const logo = $('logo'), o = $('o'), pw = $('pw');
    const set = (k, v) => stage.style.setProperty(k, v);
    let asc = FS * .71, desc = FS * .01, L = -FS * .05, R = FS * .74, t = FS * .13;
    try{
      const c = document.createElement('canvas'); c.width = c.height = 800;
      const x = c.getContext('2d', { willReadFrequently:true });
      x.font = `700 ${FS}px Outfit`; x.textBaseline = 'alphabetic';
      const m = x.measureText('O');
      asc = m.actualBoundingBoxAscent; desc = m.actualBoundingBoxDescent; L = m.actualBoundingBoxLeft; R = m.actualBoundingBoxRight;
      x.fillStyle = '#fff'; x.fillText('O', 100, 600);
      const row = x.getImageData(0, Math.round(600 - (asc - desc) / 2), 800, 1).data;
      let x0 = -1, x1 = -1;
      for (let i = 0; i < 800; i++){ const a = row[i * 4 + 3]; if (a > 127){ if (x0 < 0) x0 = i; } else if (x0 >= 0){ x1 = i; break; } }
      if (x0 >= 0 && x1 > x0) t = x1 - x0;
    }catch(e){}
    const H = asc + desc, W = logo.offsetWidth;
    const cx = o.offsetLeft + (R - L) / 2, cy = $('bl').offsetTop - (asc - desc) / 2;
    logo.style.left = (1920 - W / 2) + 'px'; logo.style.top = (CY - cy) + 'px';
    pw.style.left = (cx - H / 2) + 'px'; pw.style.top = (cy - H / 2) + 'px';
    const tp = t / H * 100, r = 50 - tp / 2;
    $('a1').setAttribute('d', `M50 ${50 + r} A${r} ${r} 0 0 1 50 ${50 - r}`);
    $('a2').setAttribute('d', `M50 ${50 + r} A${r} ${r} 0 0 0 50 ${50 - r}`);
    $('bar').setAttribute('y1', 50 - r - 7); $('bar').setAttribute('y2', 50 - r * .1);
    set('--H', H + 'px'); set('--t', t + 'px'); set('--k', K); set('--sx', (W / 2 - cx) + 'px');
    set('--sw0', tp * .24); set('--sw1', tp);
    set('--ox', (W / 2) + 'px'); set('--oy', cy + 'px');
    set('--CY', CY + 'px'); set('--D', (H * K * 1.06) + 'px'); set('--subY', (CY + H / 2 + 175) + 'px');
  }

  function play(withSound){
    clearTimeout(endTimer);
    controls.classList.remove('show');
    stage.classList.remove('play'); void stage.offsetWidth; stage.classList.add('play');
    if (withSound) sfx();
    endTimer = setTimeout(() => { stage.classList.remove('play'); controls.classList.add('show'); }, DURATION);
  }

  /* Sonido sintetizado con Web Audio */
  function sfx(){
    try{
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      ac.resume && ac.resume();
      const T = ac.currentTime + .05, out = ac.createGain(); out.gain.value = .85;
      const comp = ac.createDynamicsCompressor(); out.connect(comp); comp.connect(ac.destination);
      const noise = d => { const b = ac.createBuffer(1, ac.sampleRate * d, ac.sampleRate), x = b.getChannelData(0);
        for (let i = 0; i < x.length; i++) x[i] = Math.random() * 2 - 1; const s = ac.createBufferSource(); s.buffer = b; return s; };
      const tone = (type, f0, f1, t0, t1, peak, atk) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = type;
        o.frequency.setValueAtTime(f0, T + t0); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, T + t1);
        g.gain.setValueAtTime(0, T + t0); g.gain.linearRampToValueAtTime(peak, T + t0 + atk); g.gain.exponentialRampToValueAtTime(.0001, T + t1);
        o.connect(g).connect(out); o.start(T + t0); o.stop(T + t1 + .05); };
      // el anillo se dibuja: tono que sube
      tone('sine', 180, 520, .35, 1.35, .07, .5);
      tone('sine', 1400, 1400, 1.0, 1.25, .05, .01);          // tic de la barra
      // pulsado: clic + golpe grave
      { const n = noise(.12), f = ac.createBiquadFilter(), g = ac.createGain(); f.type = 'highpass'; f.frequency.value = 2500;
        g.gain.setValueAtTime(.4, T + 1.5); g.gain.exponentialRampToValueAtTime(.001, T + 1.6);
        n.connect(f).connect(g).connect(out); n.start(T + 1.5); }
      tone('sine', 85, 30, 1.5, 3.6, 1, .03);
      // aire mientras el anillo viaja
      { const n = noise(1.8), f = ac.createBiquadFilter(), g = ac.createGain(); f.type = 'bandpass'; f.Q.value = 1.4;
        f.frequency.setValueAtTime(500, T + 1.6); f.frequency.exponentialRampToValueAtTime(5000, T + 2.6); f.frequency.exponentialRampToValueAtTime(1000, T + 3.3);
        g.gain.setValueAtTime(0, T + 1.6); g.gain.linearRampToValueAtTime(.2, T + 2.4); g.gain.exponentialRampToValueAtTime(.001, T + 3.4);
        n.connect(f).connect(g).connect(out); n.start(T + 1.6); }
      // acorde
      [130.81, 196, 261.63, 329.63, 392, 587.33].forEach((fr, i) => {
        const o = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter(); o.type = i < 2 ? 'triangle' : 'sine';
        lp.type = 'lowpass'; lp.frequency.setValueAtTime(500, T + 2.4); lp.frequency.linearRampToValueAtTime(3200, T + 4.2);
        o.frequency.value = fr; o.detune.value = i % 2 ? 5 : -5;
        g.gain.setValueAtTime(0, T + 2.4); g.gain.linearRampToValueAtTime(.055, T + 3.4); g.gain.linearRampToValueAtTime(.0001, T + 7.1);
        o.connect(lp).connect(g).connect(out); o.start(T + 2.4); o.stop(T + 7.2);
      });
      // una nota por cada letra que se enciende
      [[1046.5, 2.52], [1318.5, 2.6], [1568, 2.8], [2093, 3.35]].forEach(([fr, st]) => tone('sine', fr, fr, st, st + 2.2, .06, .015));
    }catch(e){}
  }

  $('replay').onclick = () => play(false);
  $('sound').onclick  = () => play(true);
  const go = () => { layout(); setTimeout(() => play(false), 300); };
  const fl = document.fonts && document.fonts.load
    ? Promise.all([document.fonts.load(`700 ${FS}px Outfit`), document.fonts.load(`200 ${FS}px Outfit`), document.fonts.load('300 64px Outfit')])
    : Promise.resolve();
  fl.then(go, go);
})();
</script>
</body>
</html>
