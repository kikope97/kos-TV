name: Complemento del servidor

# Kos TV: compila el complemento del servidor (complemento/), lo publica como
# «Complemento kOS TV X.Y.Z.N» y lo añade al catálogo que lee Jellyfin
# (la publicación fija «complemento», con manifest.json y el logotipo).
#
# Todas sus publicaciones son pre-publicaciones: las apps buscan su
# actualización en la última publicación normal, y nunca deben ver estas.
# Sus etiquetas empiezan por «complemento», así que no lanzan la compilación
# de la app (que salta con etiquetas que empiezan por un número).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión X.Y.Z.N: X.Y.Z la oficial en la que se basa, N la nuestra (por ejemplo 3.1.0.1)'
        required: true
      changelog:
        description: 'Qué trae, en español (sale en el catálogo de Jellyfin)'
        required: true

permissions:
  contents: write

concurrency:
  group: complemento
  cancel-in-progress: false

jobs:
  complemento:
    name: Compilar y publicar el complemento
    runs-on: ubuntu-26.04
    env:
      VERSION: ${{ inputs.version }}
      CHANGELOG: ${{ inputs.changelog }}
      GH_TOKEN: ${{ github.token }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      # Kos TV: the NuGet packages, the plugin's and those of the Jellyfin
      # versions it is checked against ("Comprobar con cada Jellyfin").
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('complemento/**/*.csproj', 'complemento/Jellyfin/tools/abi-check/comprobar.sh') }}
          restore-keys: nuget-${{ runner.os }}-

      # Kos TV: reads the catalogue as it is now and decides whether this
      # version still has to be published. A run that failed after creating
      # the version's release but before the catalogue listed it can be run
      # again: the zip is uploaded to that release again and the catalogue
      # gets it. Only "it doesn't exist" (404) counts as no catalogue: any
      # other error stops here, or the catalogue would start empty and the
      # versions already published would drop out of it.
      - name: Comprobar la versión
        id: check
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::La versión tiene que ser X.Y.Z.N (por ejemplo 3.1.0.1): $VERSION"
            exit 1
          fi

          # Prints the release with that tag, or nothing if there is none;
          # fails on any other error.
          release_json() {
            local out
            if out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$1" 2>&1); then
              printf '%s' "$out"
            elif grep -q 'HTTP 404' <<<"$out"; then
              return 0
            else
              echo "::error::No se ha podido consultar la publicación $1: $out" >&2
              return 1
            fi
          }

          mkdir -p "$RUNNER_TEMP/antes"
          catalog=$(release_json complemento)
          if [ -z "$catalog" ]; then
            echo "Aún no hay catálogo: se empieza uno nuevo."
          elif jq -e '.assets | any(.name == "manifest.json")' <<<"$catalog" >/dev/null; then
            gh release download complemento -p manifest.json -D "$RUNNER_TEMP/antes"
            if jq -e --arg v "$VERSION" 'any(.[].versions[]?; .version == $v)' "$RUNNER_TEMP/antes/manifest.json" >/dev/null; then
              echo "::error::La versión $VERSION ya está publicada y en el catálogo."
              exit 1
            fi
          else
            echo "La publicación del catálogo no tiene manifest.json: se empieza uno nuevo."
          fi

          published=$(release_json "complemento-$VERSION")
          if [ -n "$published" ]; then
            echo "::warning::Ya hay una publicación complemento-$VERSION, pero no está en el catálogo (una ejecución anterior falló): se vuelve a subir su zip."
            echo "existing=true" >> "$GITHUB_OUTPUT"
          else
            echo "existing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pruebas del complemento
        run: |
          dotnet test complemento/Jellyfin/tests/Moonfin.Server.Tests/Moonfin.Server.Tests.csproj -c Release
          dotnet run --project complemento/Jellyfin/tools/salvage-tests -c Release

      - name: Compilar
        run: bash complemento/compilar.sh "$VERSION" "$RUNNER_TEMP/salida"

      # Kos TV: the plugin is compiled against Jellyfin 10.10, so something a
      # later Jellyfin changed compiles without a word and only fails on the
      # server when it is used. This loads the plugin just built against the
      # real assemblies of each version and stops here, before anything is
      # published, if any reference to them is broken. It needs .NET 10, set
      # up only now so everything above is still built with .NET 8.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Comprobar con cada Jellyfin
        run: bash complemento/Jellyfin/tools/abi-check/comprobar.sh complemento/Jellyfin/backend/bin/Release/net8.0/publish/Moonfin.Server.dll

      - name: Catálogo nuevo
        run: |
          ZIP="kOS-TV-complemento-$VERSION.zip"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/complemento-$VERSION/$ZIP"
          MD5="$(cat "$RUNNER_TEMP/salida/$ZIP.md5")"
          # The catalogue as it was, downloaded by "Comprobar la versión"
          # (none if there was none yet).
          python3 complemento/catalogo.py "$RUNNER_TEMP/antes/manifest.json" "$VERSION" "$URL" "$MD5" \
            "$CHANGELOG" "$RUNNER_TEMP/salida/manifest.json"

      - name: Publicar la versión
        env:
          EXISTING: ${{ steps.check.outputs.existing }}
        run: |
          ZIP="$RUNNER_TEMP/salida/kOS-TV-complemento-$VERSION.zip"
          if [ "$EXISTING" = true ]; then
            gh release upload "complemento-$VERSION" "$ZIP" --clobber
            exit 0
          fi
          gh release create "complemento-$VERSION" "$ZIP" \
            --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            --title "Complemento kOS TV $VERSION" \
            --notes "$CHANGELOG

          Para instalarlo o actualizarlo, en Jellyfin: Panel > Complementos > Repositorios, con el catálogo
          https://github.com/${GITHUB_REPOSITORY}/releases/download/complemento/manifest.json"

      - name: Publicar el catálogo
        run: |
          if ! gh release view complemento >/dev/null 2>&1; then
            gh release create complemento \
              --target "$GITHUB_SHA" \
              --prerelease --latest=false \
              --title "Complemento kOS TV · catálogo" \
              --notes "El catálogo del complemento del servidor de kOS TV para Jellyfin. En Panel > Complementos > Repositorios, añade:
          https://github.com/${GITHUB_REPOSITORY}/releases/download/complemento/manifest.json"
          fi
          cp complemento/Jellyfin/backend/assets/logo.png "$RUNNER_TEMP/salida/logo.png"
          gh release upload complemento "$RUNNER_TEMP/salida/manifest.json" "$RUNNER_TEMP/salida/logo.png" --clobber
          echo "Catálogo: https://github.com/${GITHUB_REPOSITORY}/releases/download/complemento/manifest.json"
