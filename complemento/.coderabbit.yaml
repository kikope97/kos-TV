# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
tone_instructions: >-
  Most contributors are volunteers. Be direct and friendly, explain why a change
  matters, and point to the existing code to follow. Use plain American English.

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  # The summary stays in the walkthrough comment. Writing it into the description
  # reruns the label workflow, which takes off any of its labels added by hand.
  high_level_summary_in_walkthrough: true
  in_progress_fortune: false
  # label-triage.yml owns the labels.
  suggested_labels: false
  auto_review:
    base_branches:
      - ".*"
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
  pre_merge_checks:
    docstrings:
      mode: "off"
  path_instructions:
    - path: "**/*.cs"
      instructions: |
        The plugin ships twice. Jellyfin/backend is the Jellyfin port (net8.0 against Jellyfin 10.10.0, targetAbi 10.10.0.0). Emby/Emby.Plugins.Moonfin is the Emby port (netstandard2.1 against Emby 4.9.1).
        - A change to shared behavior, models or endpoints usually belongs in both ports. Point out when only one port changed and the pull request doesn't say why.
        - Jellyfin code has to build and run against 10.10. Flag APIs that only exist in 10.11 or later unless they're guarded.
        - The Emby port targets netstandard2.1, so newer .NET APIs aren't available there.
        - MoonfinSettingsProfile is also the type of PluginConfiguration.DefaultUserSettings, which both servers save with XmlSerializer, so it can't hold a Dictionary or any other IDictionary. Keyed settings travel as a "key:value,..." string.
        - Synced settings are nullable properties on MoonfinSettingsProfile in both ports. null means "not set", and ResolveProfile walks device, then global, then admin defaults, so don't give them non-null defaults.
    - path: "**/Pages/**"
      instructions: |
        Admin pages. Admin default fields under DefaultUserSettings use a three state select (Not set, Yes, No) through setNullableBoolSelect and getNullableBoolSelect, never a checkbox, which turns null into false. Every field also has to be written in the save function (submit() on Jellyfin, saveConfig() on Emby), because updatePluginConfiguration replaces the whole object and drops anything missing. Jellyfin has one configPage.html with inline script. Emby splits it into configPage.html and moonfin.js, whose helpers take a view argument.
    - path: "**/Web/loader.js"
      instructions: |
        The Jellyfin port injects this file into the stock web client through inject.html, where it runs next to other plugins. Don't place Moonfin header UI as the toolbar child right before the user avatar box, because other plugins use that slot as their host. The Emby port serves an identical copy at /Moonfin/Web/loader.js without injecting it, so a change to one copy belongs in the other.
    - path: "Jellyfin/backend/EmulatorJS/**"
      instructions: |
        Do game state and gameManager work on the EmulatorJS `start` event, not `ready`, since gameManager doesn't exist yet on ready. Treat startGameError as the failure signal, because `exit` doesn't fire for most failures. `emu.controls[player]` is an object keyed by button number, not an array, so array methods on it throw.

chat:
  art: false
