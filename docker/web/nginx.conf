# kOS TV web: the app's files, and the way in to the household services the
# container is told about (written at start by 40-kostv-config.sh into
# /etc/nginx/kostv/).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The app's files aren't named by version, so the browser checks for a
    # new copy each time (a cheap 304 when nothing changed) and an update
    # shows up on the next visit.
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml text/plain;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The requests service (and, later, other household services).
    include /etc/nginx/kostv/*.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
