# kOS TV web: the app's files, the admin panel at /admin, and the way in to
# the household services the container is told about (written at start by
# 40-kostv-config.sh into /etc/nginx/kostv/).

# The limit on the admin panel (kostv_admin: 30 requests a minute per
# address, with room for a page's own files), written at start by
# 40-kostv-config.sh: counted by the address that reached this container, or,
# with KOSTV_TRUSTED_PROXY, by the visitor's address that proxy passes on.
include /etc/nginx/kostv-http/*.conf;

server {
    # Kos TV: 8080, as nginx runs without root (see the Dockerfile). The
    # server's port (25670 in compose.example.yml) is mapped onto it.
    listen 8080;
    server_name _;

    # Redirects stay relative, so they keep the https and the address of the
    # proxy in front.
    absolute_redirect off;

    # Behind a proxy on the home network (Nginx Proxy Manager…), the address
    # of whoever is visiting comes in X-Forwarded-For. Which addresses it is
    # taken from (any on the home network, or only KOSTV_TRUSTED_PROXY) is
    # written at start by 40-kostv-config.sh, in the include below.

    root /usr/share/nginx/html;
    index index.html;

    # Says nothing of the nginx version, and the browser keeps to what it
    # is given.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    # The app's files aren't named by version, so the browser checks for a
    # new copy each time (a cheap 304 when nothing changed) and an update
    # shows up on the next visit.
    add_header Cache-Control "no-cache" always;

    # The image brings the big files already compressed at the most
    # (gzip_static); the rest is compressed on the way, fonts included.
    gzip_static on;
    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript text/javascript application/json application/wasm image/svg+xml text/plain font/ttf font/otf application/font-sfnt application/x-font-ttf;
    gzip_min_length 1024;
    gzip_vary on;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The admin panel and the requests service (and, later, other household
    # services).
    include /etc/nginx/kostv/*.conf;

    # Kos TV: the fonts scripts/fetch-web-fonts.sh brings (fallback and
    # subtitle fonts) have their version in the path (notosanssc/v36/...), so
    # a file never changes: the browser keeps them a year without asking
    # (not a 404, hence no always on that one). An add_header here drops the
    # server's, so the rest are repeated. ^~ keeps the regex locations below
    # from taking these.
    location ^~ /fonts/ {
        types { font/woff2 woff2; font/ttf ttf; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        try_files $uri =404;
    }

    # The WebAssembly build starts from a JavaScript module (.mjs), which
    # nginx doesn't know: without its type the browser refuses to run it.
    # Fonts with their own type, so they are compressed as the rest
    # (nginx's list of types has no ttf or otf).
    location ~* \.(ttf|otf)$ {
        types { font/ttf ttf; font/otf otf; }
        try_files $uri =404;
    }

    location ~ \.mjs$ {
        types { text/javascript mjs; }
        try_files $uri =404;
    }

    # A file that isn't there is a 404, not the app's page: a tab opened
    # before an update that asks for a file the new version no longer has
    # gets a clear error instead of HTML in place of a script.
    location ~* \.(js|wasm|json|map|symbols|bin|frag|css|png|jpe?g|gif|webp|ico|svg|woff2?)$ {
        try_files $uri =404;
    }

    # Only the app's own routes fall back to its page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
