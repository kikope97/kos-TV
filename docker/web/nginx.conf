# kOS TV web: the app's files, the admin panel at /admin, and the way in to
# the household services the container is told about (written at start by
# 40-kostv-config.sh into /etc/nginx/kostv/).

# Slows down guessing the admin password: 30 requests a minute per address,
# with room for a page's own files.
#
# Counted by the address that reached this container ($realip_remote_addr),
# not the one a request says it comes from: X-Forwarded-For can be written
# by anyone on the home network, and changing it on each try would get past
# the limit. Behind a proxy that is the proxy's address.
limit_req_zone $realip_remote_addr zone=kostv_admin:1m rate=30r/m;

server {
    listen 80;
    server_name _;

    # Redirects stay relative, so they keep the https and the address of the
    # proxy in front.
    absolute_redirect off;

    # Behind a proxy on the home network (Nginx Proxy Manager…), the address
    # of whoever is visiting comes in X-Forwarded-For: use it for the logs.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    # Says nothing of the nginx version, and the browser keeps to what it
    # is given.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    # The app's files aren't named by version, so the browser checks for a
    # new copy each time (a cheap 304 when nothing changed) and an update
    # shows up on the next visit.
    add_header Cache-Control "no-cache" always;

    # The image brings the big files already compressed at the most
    # (gzip_static); the rest is compressed on the way, fonts included.
    gzip_static on;
    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript text/javascript application/json application/wasm image/svg+xml text/plain font/ttf font/otf application/font-sfnt application/x-font-ttf;
    gzip_min_length 1024;
    gzip_vary on;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The admin panel and the requests service (and, later, other household
    # services).
    include /etc/nginx/kostv/*.conf;

    # The WebAssembly build starts from a JavaScript module (.mjs), which
    # nginx doesn't know: without its type the browser refuses to run it.
    # Fonts with their own type, so they are compressed as the rest
    # (nginx's list of types has no ttf or otf).
    location ~* \.(ttf|otf)$ {
        types { font/ttf ttf; font/otf otf; }
        try_files $uri =404;
    }

    location ~ \.mjs$ {
        types { text/javascript mjs; }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
