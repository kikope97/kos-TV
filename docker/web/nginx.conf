# kOS TV web: the app's files, the admin panel at /admin, and the way in to
# the household services the container is told about (written at start by
# 40-kostv-config.sh into /etc/nginx/kostv/).

# Slows down guessing the admin password: 30 requests a minute per address,
# with room for a page's own files.
limit_req_zone $binary_remote_addr zone=kostv_admin:1m rate=30r/m;

server {
    listen 80;
    server_name _;

    # Redirects stay relative, so they keep the https and the address of the
    # proxy in front.
    absolute_redirect off;

    # Behind a proxy on the home network (Nginx Proxy Manager…), the address
    # of whoever is visiting comes in X-Forwarded-For: use it, so the admin
    # panel's limit counts each visitor and not the proxy.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    # The app's files aren't named by version, so the browser checks for a
    # new copy each time (a cheap 304 when nothing changed) and an update
    # shows up on the next visit.
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml text/plain;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The admin panel and the requests service (and, later, other household
    # services).
    include /etc/nginx/kostv/*.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
