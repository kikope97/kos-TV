# kOS TV en el servidor de casa: la web para la familia y el panel de
# administración en /admin. Más adelante, aquí irán también los demás servicios
# de kOS TV (el admin de verdad, los módulos…).
#
# Cómo usarlo (en una carpeta del servidor):
#   1. Copia este archivo como compose.yml y .env.example como .env.
#   2. Rellena .env con tus direcciones y la contraseña del admin.
#   3. docker compose up -d
#   4. En tu proxy inverso, apunta un subdominio con https al puerto 25670.
#
# En Portainer: Stacks > Add stack, pega este archivo en el editor y pon las
# variables de .env.example en "Environment variables". Ver docs/web.md.
#
# Para actualizar: docker compose pull && docker compose up -d
# Guía completa: docs/web.md

services:
  kostv-web:
    image: ghcr.io/kikope97/kos-tv-web:latest
    container_name: kostv-web
    restart: unless-stopped
    ports:
      # 25670 en el servidor (poco habitual, para no chocar con nada); 80
      # dentro del contenedor. Cambia el primero si lo tienes ocupado.
      - "25670:80"
    environment:
      # Jellyfin tal como lo abre el navegador: la dirección pública, con https.
      KOSTV_SERVER_URL: ${KOSTV_SERVER_URL:-}
      # Opcional, solo mientras Stremfin no acepte llamadas de la web (CORS): el
      # servicio de peticiones tal como lo alcanza el contenedor, que lo pasa en
      # /stremfin. Sin él, la web usa la dirección que da el complemento.
      KOSTV_REQUESTS_URL: ${KOSTV_REQUESTS_URL:-}
      # Usuario y contraseña del panel de administración (/admin).
      KOSTV_ADMIN_USER: ${KOSTV_ADMIN_USER:-admin}
      KOSTV_ADMIN_PASSWORD: ${KOSTV_ADMIN_PASSWORD:-}
